<div class="product-search-result">

  <a [href]="product.url" target="_blank">
    <div class="thumbnail">
      <div>
        <img [src]="product.thumbnail">
      </div>
    </div>
  </a>

  <div>
    <div class="title">
      <a [href]="product.url" target="_blank"> {{ product.title }} </a>
    </div>
    <div class="badges" *ngIf="product.bestSeller || product.amazonChoice || product.sponsored">
      <span class="badge best-seller" *ngIf="product.bestSeller">Best Seller</span>
      <span class="badge amazon-choice" *ngIf="product.amazonChoice">Amazon's Choice</span>
      <span class="badge sponsored" *ngIf="product.sponsored">Sponsored</span>
    </div>
    <div>
      <!-- [{{ product.score.toFixed(2) }}] -->
      {{ product.reviews.rating.toFixed(1) }}<span class="star">★ </span>
      <span class="num-reviews">({{ product.reviews.total_reviews.toLocaleString() }})</span>
      <!-- {{ product.matches }} -->
    </div>
    <div>
      <span class="current-price">{{ product.price.current_price | currency }} </span>
      <span class="list-price" *ngIf="product.price.discounted">{{ product.price.before_price | currency }}</span>
      <span class="savings" *ngIf="product.price.discounted">-{{ product.price.savings_percent }}%</span>
      <span class="prime" *ngIf="product.amazonPrime">
        <span class="check">✔</span>prime
      </span>
    </div>
  </div>

</div>
