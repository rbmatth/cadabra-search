<div id="content-container">
  <div id="search">
    <input
      type="search"
      name="searchQuery"
      id="searchQuery"
      [(ngModel)]="query"
      placeholder="Search Amazon"
      (keyup)="keyUp($event)"
      autofocus
    />
    <button type="button" class="landscape" (click)="search()">Search</button>
    <button type="button" class="portrait" (click)="search()">🔍</button>
  </div>
  <br />
  <div *ngIf="error()" class="error">{{ error() }}</div>
  <div>
    <div class="product-search-result" *ngFor="let product of products">
      <app-product-search-result
        [product]="product"
      ></app-product-search-result>
    </div>
  </div>
</div>
<app-loader *ngIf="loading()" />
