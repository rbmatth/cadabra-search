<div id="content-container">
  <div id="search">
    <input
      type="search"
      name="searchQuery"
      id="searchQuery"
      [(ngModel)]="query"
      placeholder="Search Amazon"
      (keyup)="keyUp($event)"
      autofocus
    />
    <button type="button" class="landscape" (click)="search()">Search</button>
    <button type="button" class="portrait" (click)="search()">🔍</button>
  </div>
  <div id="filters" *ngIf="products.length > 0">
    <label><input type="checkbox" [(ngModel)]="hideSponsored" /> Hide sponsored</label>
    <label><input type="checkbox" [(ngModel)]="primeOnly" /> Prime only</label>
    <label>
      Min rating
      <select [(ngModel)]="minRating">
        <option [ngValue]="0">Any</option>
        <option [ngValue]="3">3★+</option>
        <option [ngValue]="3.5">3.5★+</option>
        <option [ngValue]="4">4★+</option>
        <option [ngValue]="4.5">4.5★+</option>
      </select>
    </label>
    <label>
      Price
      <input type="number" min="0" placeholder="Min" [(ngModel)]="minPrice" />
      –
      <input type="number" min="0" placeholder="Max" [(ngModel)]="maxPrice" />
    </label>
  </div>
  <br />
  <div *ngIf="error()" class="error">{{ error() }}</div>
  <div *ngIf="searched && !loading() && !error() && products.length === 0" class="empty">No results for "{{ query }}".</div>
  <div *ngIf="!loading() && products.length > 0 && visibleProducts.length === 0" class="empty">
    {{ products.length }} results hidden by filters.
  </div>
  <div>
    <div class="product-search-result" *ngFor="let product of visibleProducts">
      <app-product-search-result
        [product]="product"
      ></app-product-search-result>
    </div>
  </div>
</div>
<app-loader *ngIf="loading()" />
